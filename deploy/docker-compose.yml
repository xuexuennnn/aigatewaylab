# aigatewaylab.xyz — static showcase site
# Fully isolated: own network, no volumes from other projects, no DB.
# The site is baked into the image at build time (immutable artifact).
services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: aigatewaylab-web:v1
    container_name: agl-web
    restart: unless-stopped
    user: "101:101"                # nginx unprivileged uid
    read_only: true
    tmpfs:
      - /tmp:size=8m
      - /var/cache/nginx:size=16m
      - /run:size=1m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [agl]
    ports:
      - "127.0.0.1:8890:8080"      # loopback only; Caddy fronts it
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
networks:
  agl:
    driver: bridge

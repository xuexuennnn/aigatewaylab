# access log without query strings or referers (redaction)
log_format redacted '$remote_addr - [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # security headers (Caddy adds HSTS at the TLS edge)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # access log with redacted format (defined at http level via conf.d include)
    access_log /dev/stdout redacted;

    location / {
        try_files $uri $uri/ =404;
    }
    location ~* \.(css|js|png|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
